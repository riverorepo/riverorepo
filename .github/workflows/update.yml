name: Update profile stats

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["today.py", "portrait_*.txt"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rebuild SVGs with live stats
        run: python today.py
        env:
          # Optional: add a classic PAT named ACCESS_TOKEN (scope: repo, read:user)
          # so private commits count too. Without it the default token is used.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
